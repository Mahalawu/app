<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4A90E2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aplikasi PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>📋 Aplikasi PWA</h1>
            <p>Terhubung dengan Google Apps Script</p>
        </header>

        <main>
            <section class="card">
                <h2>Status Koneksi</h2>
                <div id="status-indicator" class="status-offline">
                    <span class="status-dot"></span>
                    <span id="status-text">Memeriksa koneksi...</span>
                </div>
                <button id="check-connection" class="btn btn-primary">Periksa Koneksi</button>
            </section>

            <section class="card">
                <h2>📊 Data dari Backend</h2>
                <div id="data-container">
                    <p class="placeholder">Klik tombol di bawah untuk mengambil data</p>
                </div>
                <button id="fetch-data" class="btn btn-secondary">Ambil Data</button>
            </section>

            <section class="card">
                <h2>✉️ Kirim Data</h2>
                <form id="data-form">
                    <div class="form-group">
                        <label for="name">Nama</label>
                        <input type="text" id="name" placeholder="Masukkan nama" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Pesan</label>
                        <textarea id="message" placeholder="Masukkan pesan" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Kirim</button>
                </form>
                <div id="form-response" class="response-message"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 PWA dengan GAS</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
